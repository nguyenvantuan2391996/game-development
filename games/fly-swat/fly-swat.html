<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Swat</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/fly-swat.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Time: <span id="hud-time">45</span>s</div>
            <div class="hud-chip">Score: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Fly Swat</div>
                    <div class="overlay__desc" id="overlay-desc">Tap/click flies to swat them. Gold flies are worth more but vanish fast — avoid the yellow bees or you'll lose points! Press to start.</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Start</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/fly-swat-main.js"></script>
</body>
</html>
