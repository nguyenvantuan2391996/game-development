<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/2048.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Điểm: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <button type="button" class="icon-btn" id="btn-restart" title="Chơi lại">⟳</button>
        </div>

        <div class="board-wrap">
            <div class="board" id="board">
                <div class="board-bg" id="board-bg"></div>
                <div class="tiles" id="tiles"></div>
                <div class="overlay" id="overlay" hidden>
                    <div class="overlay__inner">
                        <div class="overlay__title" id="overlay-title">2048</div>
                        <div class="overlay__desc" id="overlay-desc">Gộp các ô số giống nhau để đạt 2048!</div>
                        <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                    </div>
                </div>
            </div>
        </div>

        <p class="hint">Dùng phím mũi tên / WASD hoặc vuốt trên bảng để di chuyển</p>

        <div class="touch-controls" id="touch-controls">
            <button type="button" class="dpad-btn dpad-btn--up" data-dir="up" aria-label="Lên">▲</button>
            <button type="button" class="dpad-btn dpad-btn--left" data-dir="left" aria-label="Trái">◀</button>
            <button type="button" class="dpad-btn dpad-btn--down" data-dir="down" aria-label="Xuống">▼</button>
            <button type="button" class="dpad-btn dpad-btn--right" data-dir="right" aria-label="Phải">▶</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/2048-main.js"></script>
</body>
</html>
