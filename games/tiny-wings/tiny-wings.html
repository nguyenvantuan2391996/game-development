<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Wings</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tiny-wings.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Điểm: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <div class="hud-chip">Ngày: <span id="hud-time">55</span>s</div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Tiny Wings</div>
                    <div class="overlay__desc" id="overlay-desc">Giữ Space / chạm màn hình để lao xuống dốc lấy đà, thả ra để lượn qua đồi. Nhặt ngọc và bay thật xa trước khi hết ngày!</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                </div>
            </div>
        </div>

        <p class="hint">Giữ Space / chạm màn hình để bổ nhào lấy đà xuống dốc</p>

        <div class="touch-controls" id="touch-controls">
            <button type="button" class="dpad-btn" data-dir="dive" aria-label="Bổ nhào">GIỮ ĐỂ LAO XUỐNG</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/tiny-wings-main.js"></script>
</body>
</html>
