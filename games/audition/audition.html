<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[JavaScript] - "Audition - Where Emotions Come Alive" Game</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/audition.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
<div class="snowflakes" aria-hidden="true">
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
    <div class="snowflake">❅</div>
    <div class="snowflake">❆</div>
</div>

<div class="hud-bar">
    <div class="hud-item">
        <span class="hud-label">Score</span>
        <span id="score" class="hud-value score">0</span>
    </div>
    <div class="hud-item">
        <span class="hud-label">Combo</span>
        <span id="combo" class="hud-value combo"></span>
    </div>
    <div class="hud-item">
        <span class="hud-label">Perfect Streak</span>
        <span id="perfect-streak" class="hud-value perfect-streak"></span>
    </div>
    <div class="hud-item">
        <span class="hud-label">Best</span>
        <span id="best-score" class="hud-value best">0</span>
    </div>
    <div id="count-reverse" class="hud-item hud-item--reverse">
        <p id="reverse" class="reverse"></p>
    </div>
</div>

<div id="countdown-overlay" class="overlay" style="display: none">
    <div class="overlay__inner">
        <img src="images/Ready.png" class="countdown-ready-img" alt="Ready" />
        <p id="countdown-text" class="countdown-text"></p>
    </div>
</div>

<div id="pause-overlay" class="overlay" style="display: none">
    <div class="overlay__inner">
        <p class="pause-title">Paused</p>
        <button type="button" class="overlay-btn" onclick="resumeFromPause()">Resume</button>
        <button type="button" class="overlay-btn overlay-btn--ghost" onclick="quitToHome()">Quit</button>
    </div>
</div>

<div id="4k-8k-dance">
    <div id="result">
        <img id="pic" src="images/Ready.png" class="center" alt="">
    </div>
    <div class="container" id="container">
        <div id="position-space"></div>
        <div class="box" id="box"></div>
    </div>
    <div id="list-key" class="margin-css">
        <img class="inline" id="1" src="" alt="">
        <img class="inline" id="2" src="" alt="">
        <img class="inline" id="3" src="" alt="">
        <img class="inline" id="4" src="" alt="">
        <img class="inline" id="5" src="" alt="">
        <img class="inline" id="6" src="" alt="">
        <img class="inline" id="7" src="" alt="">
        <img class="inline" id="8" src="" alt="">
        <img class="inline" id="9" src="" alt="">
        <img class="inline" id="10" src="" alt="">
        <img class="inline" id="11" src="" alt="">
    </div>
</div>

<div id="beat-up-dance">
    <div id="result-beat-up">
        <img id="pic-beat-up" src="images/Ready.png" class="center" alt="">
    </div>

    <div class="bars-beat-up">
        <div class="layout">
            <p class="col col-main">
                <img id="left-up-beat-up" src="images/left-up.png" style="width: 80px; height: 80px; margin: -25px;" alt="left-up">
                <div class="position-space-beat-up" style="margin-left: 460px; height: 62px; opacity: 40%"></div>
            <p class="col col-complementary" role="complementary">
                <img id="right-up-beat-up" src="images/right-up.png" style="width: 80px; height: 80px; margin: -25px -25px -25px 450px;" alt="right-up">
                <div class="position-space-beat-up" style="margin-left: 640px; height: 62px; opacity: 40%"></div>
        </div>
    </div>

    <div class="bars-beat-up">
        <div class="layout">
            <p class="col col-main">
                <img id="left-beat-up" src="images/left.png" style="width: 50px; height: 50px; margin: -10px" alt="left">
                <div class="position-space-beat-up" style="margin-left: 460px; height: 62px; opacity: 40%"></div>
            <p class="col col-complementary" role="complementary">
                <img id="right-beat-up" src="images/right.png" style="width: 50px; height: 50px; margin: -8px -25px -25px 470px;" alt="right">
                <div class="position-space-beat-up" style="margin-left: 640px; height: 62px; opacity: 40%"></div>
        </div>
    </div>

    <div class="bars-beat-up">
        <div class="layout">
            <p class="col col-main">
                <img id="left-down-beat-up" src="images/left-down.png" style="width: 80px; height: 80px; margin: -25px" alt="left-down">
                <div class="position-space-beat-up" style="margin-left: 460px; height: 62px; opacity: 40%"></div>
            <p class="col col-complementary" role="complementary">
                <img id="right-down-beat-up" src="images/right-down.png" style="width: 80px; height: 80px; margin: -25px -25px -25px 450px;" alt="right-down">
                <div class="position-space-beat-up" style="margin-left: 640px; height: 62px; opacity: 40%"></div>
        </div>
    </div>

    <div class="container-beat-up">
        <div class="position-space-beat-up" id="position-space-beat-up"></div>
        <div class="box" id="box-beat-up"></div>
    </div>
</div>

<div class="touch-controls" id="touch-controls">
    <div class="npad">
        <button type="button" class="npad-btn npad-btn--7" data-code="Numpad7" data-modes="8k,beat-up" aria-label="Up-Left">↖</button>
        <button type="button" class="npad-btn npad-btn--8" data-code="Numpad8" data-modes="4k,8k" aria-label="Up">↑</button>
        <button type="button" class="npad-btn npad-btn--9" data-code="Numpad9" data-modes="8k,beat-up" aria-label="Up-Right">↗</button>
        <button type="button" class="npad-btn npad-btn--4" data-code="Numpad4" data-modes="4k,8k,beat-up" aria-label="Left">←</button>
        <button type="button" class="npad-btn npad-btn--5" data-code="Space" data-modes="4k,8k,beat-up" aria-label="Beat">●</button>
        <button type="button" class="npad-btn npad-btn--6" data-code="Numpad6" data-modes="4k,8k,beat-up" aria-label="Right">→</button>
        <button type="button" class="npad-btn npad-btn--1" data-code="Numpad1" data-modes="8k,beat-up" aria-label="Down-Left">↙</button>
        <button type="button" class="npad-btn npad-btn--2" data-code="Numpad2" data-modes="4k,8k" aria-label="Down">↓</button>
        <button type="button" class="npad-btn npad-btn--3" data-code="Numpad3" data-modes="8k,beat-up" aria-label="Down-Right">↘</button>
    </div>
    <div class="touch-controls__side">
        <button type="button" class="side-btn" id="touch-pause-btn" aria-label="Pause">⏸</button>
        <button type="button" class="side-btn" data-code="NumpadDecimal" data-modes="4k,8k" aria-label="Swap keys">⇄</button>
    </div>
</div>

</body>
</html>

<script type="text/javascript" src="js/constants.js"></script>
<script type="text/javascript" src="js/utils.js"></script>
<script type="text/javascript" src="js/dance-8k-and-4k.js"></script>
<script type="text/javascript" src="js/dance-beat-up.js"></script>
