<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro - Connect 5 to Win</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/caro.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body class="home-body">
<div class="home-shell">
    <div class="home-hero">
        <span class="home-hero__eyebrow">Board game</span>
        <h1 class="home-hero__title">CARO</h1>
        <p class="home-hero__subtitle">Connect 5 in a row to win</p>
    </div>

    <section class="select-section">
        <h2 class="select-section__title">1. Choose game mode</h2>
        <div class="card-grid type-grid">
            <div class="type-card" data-value="2-players">
                <i class="fa-solid fa-user-group type-card__icon"></i>
                <div class="type-card__title">2 Players</div>
                <div class="type-card__desc">Play with a friend</div>
            </div>
            <div class="type-card" data-value="player-computer">
                <i class="fa-solid fa-robot type-card__icon"></i>
                <div class="type-card__title">Vs Computer</div>
                <div class="type-card__desc">Challenge the AI</div>
            </div>
            <div class="type-card" data-value="computer-computer">
                <i class="fa-solid fa-microchip type-card__icon"></i>
                <div class="type-card__title">Computer vs Computer</div>
                <div class="type-card__desc">Watch the AI play itself</div>
            </div>
        </div>
    </section>

    <section class="select-section">
        <h2 class="select-section__title">2. Choose board size</h2>

        <label class="size-toggle">
            <input type="checkbox" id="square-toggle" checked>
            Square board (columns equal rows)
        </label>

        <div class="size-block">
            <div class="size-block__label">Rows</div>
            <div class="card-grid size-grid" id="rows-grid"></div>
        </div>

        <div class="size-block" id="columns-block" hidden>
            <div class="size-block__label">Columns</div>
            <div class="card-grid size-grid" id="columns-grid"></div>
        </div>
    </section>

    <button type="button" class="button" id="button" onclick="handleLetGo()">
        <i class="fa-solid fa-play"></i> Let's go!
    </button>
</div>
</body>
</html>

<script type="text/javascript" src="js/constants.js"></script>
<script type="text/javascript" src="js/utils.js"></script>
<script type="text/javascript" src="js/caro-home.js"></script>
