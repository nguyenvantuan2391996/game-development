<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stack.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Điểm: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Stack</div>
                    <div class="overlay__desc" id="overlay-desc">Canh thời điểm để xếp các khối chồng lên nhau. Nhấn để thả khối.</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                </div>
            </div>
        </div>

        <p class="hint">Nhấn Space / chạm màn hình để thả khối đúng lúc</p>

        <div class="touch-controls" id="touch-controls">
            <button type="button" class="dpad-btn" data-dir="drop" aria-label="Thả khối">THẢ KHỐI</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/stack-main.js"></script>
</body>
</html>
