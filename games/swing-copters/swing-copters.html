<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swing Copters</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/swing-copters.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip hud-chip--ai" id="hud-episode-chip">Episode: <span id="hud-episode">0</span></div>
            <div class="hud-chip hud-chip--ai" id="hud-epsilon-chip">Epsilon: <span id="hud-epsilon">1.00</span></div>
        </div>

        <div id="game-container"></div>

        <div class="ai-controls" id="ai-controls">
            <span class="ai-controls__label">Speed:</span>
            <button type="button" class="speed-btn" data-scale="2">Slow</button>
            <button type="button" class="speed-btn speed-btn--active" data-scale="1">Normal</button>
            <button type="button" class="speed-btn" data-scale="0.5">Fast</button>
            <button type="button" class="speed-btn" data-scale="0.25">Turbo</button>
            <button type="button" class="reset-btn" id="btn-reset-ai">Reset & retrain</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="js/q-learning-agent.js"></script>
    <script src="js/swing-copters-main.js"></script>
</body>
</html>
