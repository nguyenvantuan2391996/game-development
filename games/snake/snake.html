<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/snake.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Score: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <div class="hud-chip hud-chip--ai" id="hud-episode-chip">Episode: <span id="hud-episode">0</span></div>
            <div class="hud-chip hud-chip--ai" id="hud-epsilon-chip">Epsilon: <span id="hud-epsilon">1.00</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Snake</div>
                    <div class="overlay__desc" id="overlay-desc">Press an arrow key or tap to start</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Start</button>
                </div>
            </div>
        </div>

        <div class="ai-controls" id="ai-controls">
            <span class="ai-controls__label">Speed:</span>
            <button type="button" class="speed-btn" data-delay="150">Slow</button>
            <button type="button" class="speed-btn speed-btn--active" data-delay="60">Medium</button>
            <button type="button" class="speed-btn" data-delay="20">Fast</button>
            <button type="button" class="speed-btn" data-delay="2">Turbo</button>
            <button type="button" class="reset-btn" id="btn-reset-ai">Reset AI learning</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/snake-engine.js"></script>
    <script src="js/q-learning-agent.js"></script>
    <script src="js/snake-main.js"></script>
</body>
</html>
