<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Fighter</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/road-fighter.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Điểm: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <div class="hud-chip">Tốc độ: <span id="hud-speed">0</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="fuel-bar-wrap">
                <div class="fuel-bar-label">XĂNG</div>
                <div class="fuel-bar-track"><div class="fuel-bar-fill" id="fuel-bar-fill"></div></div>
            </div>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Road Fighter</div>
                    <div class="overlay__desc" id="overlay-desc">Trái/Phải để lái, Lên/Xuống để tăng/giảm tốc. Nhấn để bắt đầu.</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/road-fighter-main.js"></script>
</body>
</html>
