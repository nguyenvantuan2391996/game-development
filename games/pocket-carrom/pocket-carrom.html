<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Carrom</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pocket-carrom.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Bạn: <span id="hud-player-score">0</span></div>
            <div class="hud-chip">Máy: <span id="hud-cpu-score">0</span></div>
            <div class="hud-chip">Lượt: <span id="hud-turn">Bạn</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Pocket Carrom</div>
                    <div class="overlay__desc" id="overlay-desc">Kéo từ quân cái (trắng lớn) ra xa để ngắm hướng, chỉnh lực bằng thanh trượt rồi nhấn Bắn. Đưa quân trắng của bạn vào lỗ để ghi điểm và được đánh tiếp. Nhấn để bắt đầu.</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                </div>
            </div>
        </div>

        <div class="touch-hint" id="touch-hint">👆 Kéo quân trắng lớn để ngắm hướng, chỉnh lực rồi nhấn Bắn</div>

        <div class="shot-controls" id="shot-controls">
            <div class="shot-controls__power">
                <label for="power-slider">Lực bắn: <span id="power-label">50%</span></label>
                <input type="range" id="power-slider" min="0" max="100" value="50" step="1">
            </div>
            <button type="button" class="shoot-btn" id="shoot-btn" disabled>BẮN</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/pocket-carrom-main.js"></script>
</body>
</html>
