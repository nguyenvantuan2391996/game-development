<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pikachu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pikachu.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body class="game-body">
<div class="game-shell">
    <div class="game-header">
        <span class="game-header__title">PIKACHU</span>
    </div>

    <div class="hud-bar">
        <button type="button" class="icon-btn" title="Về trang chủ" onclick="window.location.href='/game-development/games/pikachu/home.html'">
            <i class="fa-solid fa-house"></i>
        </button>

        <div class="hud-item">
            <span class="hud-label">Cặp còn lại</span>
            <span id="pairs-left" class="hud-value pairs">0</span>
        </div>

        <div class="hud-item">
            <span class="hud-label">Lượt chọn</span>
            <span id="move-count" class="hud-value">0</span>
        </div>

        <div class="hud-item">
            <span class="hud-label">Bàn chơi</span>
            <span id="board-size" class="hud-value board-size">-</span>
        </div>

        <button type="button" class="icon-btn" id="btn-restart" title="Chơi lại">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </div>

    <div class="board-wrap" id="board-wrap">
        <table id="table_game_pikachu"></table>
    </div>
</div>
</body>
</html>

<script type="text/javascript" src="js/constants.js"></script>
<script type="text/javascript" src="js/utils.js"></script>
<script type="text/javascript" src="js/pikachu-main.js"></script>
