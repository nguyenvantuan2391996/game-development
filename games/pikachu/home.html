<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu - Ghép hình</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/pikachu.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body class="home-body">
<div class="home-shell">
    <div class="home-hero">
        <span class="home-hero__eyebrow">Memory match game</span>
        <h1 class="home-hero__title">PIKACHU</h1>
        <p class="home-hero__subtitle">Nối 2 hình giống nhau bằng đường thẳng tối đa 2 khúc cua</p>
    </div>

    <section class="select-section">
        <h2 class="select-section__title">Chọn kích thước bàn chơi</h2>

        <label class="size-toggle">
            <input type="checkbox" id="square-toggle" checked>
            Bàn vuông (số cột bằng số hàng)
        </label>

        <div class="size-block">
            <div class="size-block__label">Số hàng</div>
            <div class="card-grid size-grid" id="rows-grid"></div>
        </div>

        <div class="size-block" id="columns-block" hidden>
            <div class="size-block__label">Số cột</div>
            <div class="card-grid size-grid" id="columns-grid"></div>
        </div>
    </section>

    <button type="button" class="button" id="button" onclick="handleLetGo()">
        <i class="fa-solid fa-play"></i> Let's go!
    </button>
</div>
</body>
</html>

<script type="text/javascript" src="js/constants.js"></script>
<script type="text/javascript" src="js/utils.js"></script>
<script type="text/javascript" src="js/pikachu-home.js"></script>
