<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bắn Tank 1990</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tank-1990.css">
    <script src="/game-development/js/block-devtools.js"></script>
</head>
<body>
    <div class="bg-glow"></div>

    <a class="back-link" href="home.html">&larr; Menu</a>

    <div class="game-shell">
        <div class="hud-bar">
            <div class="hud-chip">Mạng: <span id="hud-lives">3</span></div>
            <div class="hud-chip">Điểm: <span id="hud-score">0</span></div>
            <div class="hud-chip">Best: <span id="hud-best">0</span></div>
            <div class="hud-chip">Wave: <span id="hud-wave">1</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game-canvas"></canvas>
            <div class="boss-banner" id="boss-banner" hidden>BOSS XUẤT HIỆN!</div>
            <div class="overlay" id="overlay">
                <div class="overlay__inner">
                    <div class="overlay__title" id="overlay-title">Bắn Tank 1990</div>
                    <div class="overlay__desc" id="overlay-desc">Mũi tên / WASD để di chuyển, Space để bắn. Nhấn để bắt đầu.</div>
                    <button type="button" class="overlay__btn" id="overlay-btn">Bắt đầu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/tile-map.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/tank.js"></script>
    <script src="js/tank-1990-main.js"></script>
</body>
</html>
