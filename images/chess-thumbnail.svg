<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <rect width="360" height="360" fill="#181428"/>
  <g>
    <rect x="0" y="0" width="45" height="45" fill="#2c2747"/>
    <rect x="90" y="0" width="45" height="45" fill="#2c2747"/>
    <rect x="180" y="0" width="45" height="45" fill="#2c2747"/>
    <rect x="270" y="0" width="45" height="45" fill="#2c2747"/>
    <rect x="45" y="45" width="45" height="45" fill="#2c2747"/>
    <rect x="135" y="45" width="45" height="45" fill="#2c2747"/>
    <rect x="225" y="45" width="45" height="45" fill="#2c2747"/>
    <rect x="315" y="45" width="45" height="45" fill="#2c2747"/>
    <rect x="0" y="90" width="45" height="45" fill="#2c2747"/>
    <rect x="90" y="90" width="45" height="45" fill="#2c2747"/>
    <rect x="180" y="90" width="45" height="45" fill="#2c2747"/>
    <rect x="270" y="90" width="45" height="45" fill="#2c2747"/>
  </g>
  <rect x="0" y="0" width="360" height="360" fill="none"/>
  <g fill="none">
    <rect x="45" y="0" width="45" height="45" fill="none"/>
  </g>
  <!-- fill remaining light squares (checker pattern) -->
  <g>
    <rect x="45" y="0" width="45" height="45" fill="#0f0c1c"/>
    <rect x="135" y="0" width="45" height="45" fill="#0f0c1c"/>
    <rect x="225" y="0" width="45" height="45" fill="#0f0c1c"/>
    <rect x="315" y="0" width="45" height="45" fill="#0f0c1c"/>
    <rect x="0" y="45" width="45" height="45" fill="#0f0c1c"/>
    <rect x="90" y="45" width="45" height="45" fill="#0f0c1c"/>
    <rect x="180" y="45" width="45" height="45" fill="#0f0c1c"/>
    <rect x="270" y="45" width="45" height="45" fill="#0f0c1c"/>
  </g>

  <text x="67" y="240" font-size="80" text-anchor="middle" fill="#f5f4fb">♔</text>
  <text x="180" y="240" font-size="80" text-anchor="middle" fill="#f5f4fb">♕</text>
  <text x="293" y="240" font-size="80" text-anchor="middle" fill="#0b0a1f" stroke="#7c5cff" stroke-width="1.5">♞</text>
